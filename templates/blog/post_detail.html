{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Blog</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" type="text/css">
</head>
<body>

    <!-- Header with logo and menu -->
    <header>
        <div class="logo">
            <img src="{% static 'images/infomax-logo.png' %}" alt="Logo">
        </div>
        <nav>
            <ul>
                <li><a href="?">Главная</a></li>
                <li><a href="#">О нас</a></li>
                <li><a href="#">Новости</a></li>
                <li><a href="#">Контакты</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Section -->

       <!-- <section class="hero">
            <div class="hero-content">
                <h1>Добро пожаловать на Mini Blog</h1>
                <p>Читайте свежие новости и интересные статьи</p>
            </div>
        </section>--!>
<!-- Main Content Section -->
    <main class="post-detail-details">
        <div class="container-details">
            <div class="post-header-details">
                <h1>{{ post.title }}</h1>
                <div class="date-details">{{ post.date_published|date:"d M, Y" }}</div>
            </div>
            {% if post.image %}
                <div class="post-image-details">
                    <img src="{{ post.image.url }}" alt="{{ post.title }}">
                </div>
            {% endif %}
            <div class="post-content-details">
                <p>{{ post.content }}</p>
            </div>
            <div class="back-link-details">
                <a href="/">Назад к блогу</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Mini Blog. Все права защищены.</p>
    </footer>

</body>
</html>
